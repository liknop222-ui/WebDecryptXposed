# .github/workflows/android-ci.yml
name: Build Android APK

on:
  push:                # 当你推送代码到 main 分支时，自动触发
    branches: [ main ]
  workflow_dispatch:   # 在 GitHub 网页上，你也可以手动点击按钮来触发构建

jobs:
  build:
    runs-on: ubuntu-latest # 在 GitHub 提供的 Ubuntu 服务器上运行

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # 第一步：获取你仓库中的代码

    - name: Set up JDK 17
      uses: actions/setup-java@v4 # 第二步：设置 Java 开发环境
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3 # 第三步：设置 Android 开发环境

    - name: Build Debug APK with Gradle
      run: chmod +x gradlew && ./gradlew assembleDebug # 第四步：执行 Gradle 命令，开始打包

    - name: Upload APK
      uses: actions/upload-artifact@v4 # 第五步：将打包好的 APK 上传为工作流产物
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk